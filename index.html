<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아로하 여행 MV 촬영 콜시트</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow" data-i18n="topEyebrow">후쿠오카 · 벳푸 · 프로포즈링</p>
        <h1 data-i18n="appTitle">아로하 여행 MV 촬영 콜시트</h1>
      </div>
      <div class="top-actions" aria-label="촬영 도구" data-i18n-aria="topActionsAria">
        <div class="language-switcher" aria-label="언어 선택" data-i18n-aria="languageAria">
          <button class="lang-button active" type="button" data-lang="ko">KO</button>
          <button class="lang-button" type="button" data-lang="en">EN</button>
          <button class="lang-button" type="button" data-lang="vi">VI</button>
        </div>
        <button class="icon-button" id="printBtn" type="button" title="인쇄" data-i18n-title="printTitle">
          <i data-lucide="printer"></i>
        </button>
        <button class="icon-button" id="exportBtn" type="button" title="진행상황 내보내기" data-i18n-title="exportTitle">
          <i data-lucide="download"></i>
        </button>
        <button class="icon-button danger" id="resetBtn" type="button" title="체크 초기화" data-i18n-title="resetTitle">
          <i data-lucide="rotate-ccw"></i>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="sidebar collapsed" id="sidebar" aria-label="일정 선택" data-i18n-aria="sidebarAria">
        <div class="sidebar-head">
          <button class="icon-button sidebar-toggle" id="sidebarToggle" type="button" aria-expanded="false"></button>
        </div>
        <section class="summary-panel">
          <div>
            <span class="summary-label" data-i18n="overallProgress">전체 진행률</span>
            <strong id="progressText">0%</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progressBar"></div>
          </div>
        </section>

        <nav class="day-list" id="dayList"></nav>
      </aside>

      <section class="workspace" aria-live="polite">
        <div class="day-hero">
          <div>
            <p class="eyebrow" id="selectedMood">여행 시작</p>
            <h2 id="selectedTitle">8/9 후쿠오카 도착</h2>
            <p id="selectedDirectorNote"></p>
          </div>
          <div class="hero-badges" id="heroBadges"></div>
        </div>

        <div class="mobile-tabs primary-tabs" role="tablist" aria-label="보기 전환" data-i18n-aria="tabsAria">
          <button class="tab active" type="button" data-tab="shots">
            <i data-lucide="clapperboard"></i>
            <span data-i18n="tabShots">촬영</span>
          </button>
          <button class="tab" type="button" data-tab="schedule">
            <i data-lucide="calendar-days"></i>
            <span data-i18n="tabSchedule">여행 동선</span>
          </button>
          <button class="tab" type="button" data-tab="reference">
            <i data-lucide="book-open"></i>
            <span data-i18n="tabReference">참고</span>
          </button>
          <button class="tab" type="button" data-tab="souvenirs">
            <i data-lucide="gift"></i>
            <span data-i18n="tabSouvenirs">기념품</span>
          </button>
        </div>

        <div class="content-grid">
          <section class="panel shot-panel" data-panel="shots">
            <div class="section-head">
              <div>
                <span class="summary-label" data-i18n="shotEyebrow">오늘 꼭 찍을 컷</span>
                <h3 data-i18n="shotTitle">촬영 체크리스트</h3>
              </div>
              <div class="section-actions">
                <button class="text-button" id="editShotsBtn" type="button">
                  <i data-lucide="square-pen"></i>
                  <span data-i18n="editShots">촬영 편집</span>
                </button>
                <button class="text-button" id="completeDayBtn" type="button">
                  <i data-lucide="check-check"></i>
                  <span data-i18n="completeDay">오늘 컷 완료</span>
                </button>
              </div>
            </div>
            <section class="mv-flow" aria-labelledby="mvFlowTitle">
              <header class="mv-flow-header">
                <div>
                  <span class="summary-label" id="mvChapter"></span>
                  <h4 id="mvFlowTitle" data-i18n="mvFlowTitle">오늘의 MV 러프컷</h4>
                </div>
                <p data-i18n="mvFlowIntro">촬영 순서가 아니라 아래 순서대로 편집 타임라인에 놓습니다.</p>
              </header>
              <div class="mv-flow-list" id="mvFlowList"></div>
            </section>
            <div class="checklist-heading">
              <span class="summary-label" data-i18n="checklistLabel">촬영 현장 체크</span>
            </div>
            <div id="shotList" class="shot-list"></div>
            <section class="proposal-section">
              <div class="section-head subsection-head">
                <div>
                  <span class="summary-label" data-i18n="ringEyebrow">프로포즈 촬영 메모</span>
                  <h3 data-i18n="ringTitle">반지와 감정 연출</h3>
                </div>
                <i data-lucide="gem" aria-hidden="true"></i>
              </div>
              <div id="ringPlan" class="ring-plan"></div>
            </section>
          </section>

          <section class="panel schedule-panel" data-panel="schedule">
            <div class="section-head">
              <div>
                <span class="summary-label" data-i18n="scheduleEyebrow">동선과 예약</span>
                <h3 data-i18n="scheduleTitle">현장 메모</h3>
              </div>
            </div>
            <div id="scheduleList" class="info-list"></div>
          </section>

          <section class="panel reference-panel" data-panel="reference">
            <div class="section-head">
              <div>
                <span class="summary-label" data-i18n="referenceEyebrow">일본 현장 참고</span>
                <h3 data-i18n="referenceTitle">사용법과 Insta360 X2 운용</h3>
              </div>
            </div>
            <div id="referenceGuide" class="reference-guide"></div>
          </section>

          <section class="panel souvenir-panel" data-panel="souvenirs">
            <div class="section-head">
              <div>
                <span class="summary-label">하카타역 오미야게</span>
                <h3>기념품 최단 동선 (지하 1층 → 1층)</h3>
              </div>
            </div>
            <div id="souvenirList" class="info-list"></div>
          </section>
        </div>
      </section>
    </main>

    <dialog class="inspiration-dialog" id="inspirationDialog">
      <div class="inspiration-shell">
        <header class="editor-header">
          <div>
            <p class="eyebrow" data-i18n="inspirationTitle">B-roll 영감 보드</p>
            <h2 id="inspirationBoardTitle"></h2>
          </div>
          <button class="icon-button" id="inspirationCloseBtn" type="button" data-i18n-title="closeExamples">
            <i data-lucide="x"></i>
          </button>
        </header>
        <p class="inspiration-lead" id="inspirationLead"></p>
        <div class="inspiration-gallery" id="inspirationGallery"></div>
      </div>
    </dialog>

    <dialog class="editor-dialog" id="shotEditorDialog">
      <div class="editor-shell">
        <header class="editor-header">
          <div>
            <p class="eyebrow" id="editorContext"></p>
            <h2 data-i18n="editorTitle">촬영 내용 편집</h2>
          </div>
          <button class="icon-button" id="editorCloseBtn" type="button" data-i18n-title="closeTitle">
            <i data-lucide="x"></i>
          </button>
        </header>

        <div class="editor-key-row">
          <label for="editorKeyInput" data-i18n="editorKey">편집 키</label>
          <input id="editorKeyInput" type="password" autocomplete="current-password" data-i18n-placeholder="editorKeyPlaceholder" />
        </div>

        <div class="editor-rows" id="editorRows"></div>

        <button class="text-button add-shot-button" id="addShotBtn" type="button">
          <i data-lucide="plus"></i>
          <span data-i18n="addShot">촬영 항목 추가</span>
        </button>

        <footer class="editor-footer">
          <span class="editor-status" id="editorStatus" role="status"></span>
          <div class="editor-footer-actions">
            <button class="text-button" id="editorCancelBtn" type="button" data-i18n="cancel">취소</button>
            <button class="text-button primary" id="saveShotsBtn" type="button">
              <i data-lucide="git-commit-horizontal"></i>
              <span data-i18n="saveToGit">Git에 저장</span>
            </button>
          </div>
        </footer>
      </div>
      <datalist id="techniqueOptions"></datalist>
    </dialog>

    <template id="dayButtonTemplate">
      <button class="day-button" type="button">
        <span class="day-date"></span>
        <span class="day-name"></span>
        <span class="day-progress"></span>
      </button>
    </template>

    <template id="shotTemplate">
      <label class="shot-item">
        <input type="checkbox" />
        <span class="shot-main">
          <strong></strong>
          <small></small>
        </span>
        <span class="shot-meta"></span>
      </label>
    </template>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
